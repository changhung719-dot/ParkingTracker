name: Export .NET 8 Offline Build Kit

on:
  pull_request:
    paths:
      - '.github/workflows/export-dotnet8-offline-buildkit.yml'
      - 'temp-dotnet-buildkit/**'

permissions:
  contents: read

jobs:
  export-buildkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Select .NET 8 SDK and restore Windows packs
        shell: bash
        run: |
          set -euo pipefail
          SDK_VERSION="$(dotnet --list-sdks | awk '/^8\.0\./ {print $1}' | sort -V | tail -1)"
          if [ -z "$SDK_VERSION" ]; then echo 'No .NET 8 SDK found'; exit 1; fi
          printf '{"sdk":{"version":"%s","rollForward":"latestPatch"}}\n' "$SDK_VERSION" > global.json
          dotnet --version
          dotnet --info
          dotnet restore temp-dotnet-buildkit/BuildKit.csproj -r win-x64
          dotnet publish temp-dotnet-buildkit/BuildKit.csproj -c Release -r win-x64 --self-contained true --no-restore -o temp-dotnet-buildkit/publish

      - name: Package minimal SDK and NuGet cache
        shell: bash
        run: |
          set -euo pipefail
          DOTNET_BIN="$(readlink -f "$(command -v dotnet)")"
          DOTNET_ROOT_DIR="$(dirname "$DOTNET_BIN")"
          SDK_VERSION="$(dotnet --version)"
          CORE_RUNTIME_VERSION="$(dotnet --list-runtimes | awk '/Microsoft.NETCore.App 8\.0\./ {print $2}' | sort -V | tail -1)"
          echo "DOTNET_ROOT=$DOTNET_ROOT_DIR"
          echo "SDK_VERSION=$SDK_VERSION"
          echo "CORE_RUNTIME_VERSION=$CORE_RUNTIME_VERSION"

          mkdir -p buildkit/dotnet/host/fxr buildkit/dotnet/shared/Microsoft.NETCore.App buildkit/dotnet/sdk buildkit/dotnet/packs buildkit/nuget
          cp -a "$DOTNET_BIN" buildkit/dotnet/dotnet
          cp -a "$DOTNET_ROOT_DIR/host/fxr/$CORE_RUNTIME_VERSION" buildkit/dotnet/host/fxr/
          cp -a "$DOTNET_ROOT_DIR/shared/Microsoft.NETCore.App/$CORE_RUNTIME_VERSION" buildkit/dotnet/shared/Microsoft.NETCore.App/
          cp -a "$DOTNET_ROOT_DIR/sdk/$SDK_VERSION" buildkit/dotnet/sdk/

          for pack in Microsoft.NETCore.App.Ref Microsoft.NETCore.App.Host.linux-x64 NETStandard.Library.Ref; do
            if [ -d "$DOTNET_ROOT_DIR/packs/$pack" ]; then
              cp -a "$DOTNET_ROOT_DIR/packs/$pack" buildkit/dotnet/packs/
            fi
          done

          if [ -d "$DOTNET_ROOT_DIR/sdk-manifests" ]; then cp -a "$DOTNET_ROOT_DIR/sdk-manifests" buildkit/dotnet/; fi
          if [ -d "$DOTNET_ROOT_DIR/metadata" ]; then cp -a "$DOTNET_ROOT_DIR/metadata" buildkit/dotnet/; fi
          if [ -d "$HOME/.nuget/packages" ]; then cp -a "$HOME/.nuget/packages/." buildkit/nuget/; fi

          tar -czf dotnet8-offline-buildkit-linux-x64.tar.gz -C buildkit .
          ls -lh dotnet8-offline-buildkit-linux-x64.tar.gz

      - name: Upload build kit
        uses: actions/upload-artifact@v4
        with:
          name: dotnet8-offline-buildkit-linux-x64-v3
          path: dotnet8-offline-buildkit-linux-x64.tar.gz
          compression-level: 0
          retention-days: 1
