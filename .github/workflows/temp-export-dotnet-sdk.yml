name: Temporary export .NET 8 SDK

on:
  push:
    branches:
      - temp-dotnet-sdk-8-0-423
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify official .NET SDK
        shell: bash
        run: |
          set -euo pipefail
          url="https://builds.dotnet.microsoft.com/dotnet/Sdk/8.0.423/dotnet-sdk-8.0.423-linux-x64.tar.gz"
          expected="e94513dfe42271a85f01e87bd4272aa80b4ec13556f4531754802542225667775242c5e281a94837dae6cc65f7bcc457d2f663f240c0e2b7573fd909e786b1a5"
          curl --fail --location --retry 5 --output dotnet-sdk.tar.gz "$url"
          echo "$expected  dotnet-sdk.tar.gz" | sha512sum --check --strict
          mkdir dotnet-sdk
          tar -xzf dotnet-sdk.tar.gz -C dotnet-sdk
          ./dotnet-sdk/dotnet --info
      - name: Upload SDK as compressed ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-8.0.423-linux-x64-compressed
          path: dotnet-sdk/
          compression-level: 9
          retention-days: 1
          if-no-files-found: error
